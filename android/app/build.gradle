plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'br.com.isleep.app'
    compileSdk 36
    defaultConfig { applicationId 'br.com.isleep.app'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildTypes { release { minifyEnabled false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    kotlinOptions { jvmTarget = '21' }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.health.connect:connect-client:1.2.0-alpha06'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}

apply from: 'capacitor.build.gradle'
